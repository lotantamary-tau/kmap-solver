<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>K-Map Solver</title>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="kmap-core.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 24px auto; padding: 0 16px; }
    h1 { margin: 0 0 8px; }
    .step { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-top: 16px; }
    .step.disabled { opacity: 0.5; pointer-events: none; }
    .breadcrumb { display: flex; gap: 8px; font-size: 13px; color: #666; margin-bottom: 12px; }
    .breadcrumb .active { color: #000; font-weight: 600; }
    .name-inputs { display: flex; gap: 8px; flex-wrap: wrap; }
    .name-inputs input { width: 60px; padding: 4px; }
    .err { color: #c00; font-size: 13px; margin-top: 4px; }
    button { padding: 6px 12px; border-radius: 4px; border: 1px solid #888; background: #f5f5f5; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    table.truthTable { border-collapse: collapse; margin-top: 8px; }
    table.truthTable th, table.truthTable td { border: 1px solid #999; padding: 4px 10px; text-align: center; min-width: 30px; }
    table.truthTable td.f { cursor: pointer; user-select: none; font-weight: 600; }
    table.truthTable td.f.x { color: #888; font-style: italic; }
    table.truthTable td.f.wrong { background: #fdd; }
    .kmap { display: inline-block; position: relative; margin-top: 8px; }
    .kmap-row { display: flex; }
    .kmap-cell { box-sizing: border-box; width: 64px; height: 64px; border: 1px solid #999; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; user-select: none; position: relative; background: #fff; }
    .kmap-cell .mint { position: absolute; top: 2px; left: 4px; font-size: 10px; color: #aaa; }
    .kmap-cell.x { color: #888; font-style: italic; }
    .kmap-cell.wrong { background: #fdd; }
    .kmap-header { font-size: 12px; color: #666; padding: 4px 8px; }
    .kmap-overlay { position: absolute; top: 0; left: 0; pointer-events: none; }
    .kmap-overlay .rect {
      position: absolute;
      border: 3px solid;
      border-radius: 10px;
      box-sizing: border-box;
      transition: opacity 0.2s, border-width 0.2s;
    }
    .kmap-overlay .rect.flash { opacity: 1 !important; border-width: 5px; }
    .kmap-overlay .rect-label {
      position: absolute;
      top: -10px;
      left: 8px;
      background: #fff;
      padding: 0 6px;
      font-family: monospace;
      font-size: 13px;
      font-weight: 700;
      border-radius: 3px;
      white-space: nowrap;
    }
    .kmap-cell.pending {
      outline: 3px dashed #06c;
      outline-offset: -3px;
      z-index: 1;
      background-color: rgba(6, 112, 204, 0.12);
    }
    .kmap-cell.dragging {
      outline: 3px dashed #06c;
      outline-offset: -3px;
      z-index: 1;
      background-color: rgba(6, 112, 204, 0.05);
    }
    .group-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      margin: 4px 6px 4px 0;
      border-radius: 8px;
      border: 2px solid;
      background: #fff;
      font-family: monospace;
      font-size: 14px;
      cursor: pointer;
      user-select: none;
      transition: transform 0.1s;
    }
    .group-chip:hover { transform: translateY(-1px); }
    .group-chip .swatch {
      display: inline-block;
      width: 14px;
      height: 14px;
      border-radius: 3px;
    }
    .group-chip .remove {
      margin-left: 4px;
      cursor: pointer;
      color: #c00;
      font-weight: 700;
      padding: 0 4px;
    }
    .solve-section { margin-top: 16px; padding-top: 12px; border-top: 1px solid #eee; }
    .solve-section h4 { margin: 0 0 8px; color: #666; font-weight: 500; font-size: 14px; }
    .edit-link { font-size: 13px; margin-left: 12px; color: #06c; cursor: pointer; text-decoration: none; }
    .edit-link:hover { text-decoration: underline; }
    .edit-link.active { color: #c00; font-weight: 600; }
    .step-header { display: flex; justify-content: space-between; align-items: center; }
    .step-header h2 { margin: 0; }
    .reset-link { font-size: 12px; color: #888; text-decoration: none; }
    .reset-link:hover { color: #c00; text-decoration: underline; }
  </style>
</head>
<body>
  <h1>K-Map Solver</h1>
  <div class="breadcrumb" id="breadcrumb">
    <span class="active">1. Variables</span>
    <span>→</span><span>2. Truth table</span>
    <span>→</span><span>3. K-map</span>
    <span>→</span><span>4. Solve</span>
    <span>→</span><span>5. Export</span>
  </div>

  <section id="step1" class="step">
    <h2>Step 1 — Variables</h2>
    <label>How many variables?
      <select id="varCount">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4" selected>4</option>
      </select>
    </label>
    <div style="margin-top: 8px;">
      Names: <span class="name-inputs" id="nameInputs"></span>
    </div>
    <div style="margin-top: 12px;">
      <label>Expression (optional): <input id="exprInput" type="text" style="width: 320px;" placeholder="e.g. A'B + AC"></label>
      <div class="err" id="step1ExprErr"></div>
    </div>
    <div class="err" id="step1Err"></div>
    <button id="continueBtn" style="margin-top: 12px;">Continue</button>
  </section>

  <section id="step2" class="step disabled">
    <div class="step-header">
      <h2>Step 2 — Truth table</h2>
      <a href="#" class="reset-link" data-step="2">Reset this step</a>
    </div>
    <div id="step2Body"></div>
  </section>
  <section id="step3" class="step disabled">
    <div class="step-header">
      <h2>Step 3 — K-map</h2>
      <a href="#" class="reset-link" data-step="3">Reset this step</a>
    </div>
    <div id="step3Body"></div>
  </section>
  <section id="step4" class="step disabled">
    <div class="step-header">
      <h2>Step 4 — Solve</h2>
      <a href="#" class="reset-link" data-step="4">Reset this step</a>
    </div>
    <div id="step4Body"></div>
  </section>
  <section id="step5" class="step disabled">
    <div class="step-header">
      <h2>Step 5 — Export</h2>
      <a href="#" class="reset-link" data-step="5">Reset this step</a>
    </div>
    <div id="step5Body"></div>
  </section>

  <div id="errBar" style="position: fixed; bottom: 16px; right: 16px; background: #c00; color: #fff; padding: 8px 14px; border-radius: 4px; font-size: 13px; display: none; z-index: 100; max-width: 300px;"></div>

  <script>
    'use strict';
    let errTimer = null;
    function showError(msg) {
      const bar = document.getElementById('errBar');
      if (!bar) return;
      bar.textContent = msg;
      bar.style.display = 'block';
      if (errTimer) clearTimeout(errTimer);
      errTimer = setTimeout(() => { bar.style.display = 'none'; }, 5000);
    }

    const RESERVED = new Set(['AND','OR','NOT','and','or','not']);
    const PALETTE = ['#e63946', '#1d9bf0', '#2a9d8f', '#f4a261', '#9b5de5', '#ff6700', '#06d6a0', '#ef476f'];
    function paletteColor(i) { return PALETTE[i % PALETTE.length]; }
    function withAlpha(hex, a) {
      // accept '#rrggbb', return rgba string with alpha 0..1
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r}, ${g}, ${b}, ${a})`;
    }
    const state = {
      n: null, varNames: [], values: [], step: 1, kmapBuilt: false,
      answerKey: null, solveMode: null, solverGroups: [], manualGroups: [],
      manualMode: false, pendingSelection: new Set(),
      kmapDraft: null,  // null until Step 3 begins; then Array(2^n) of (0|1|'X'|null) for "Check K-map"
      _step4Rendered: false,
      _step5Rendered: false,
      _exportReady: true,
      dragging: null,
      _suppressClick: false,
    };

    function renderExprBanner(bodyId) {
      if (!state.answerKey) return;
      const body = document.getElementById(bodyId);
      if (!body) return;
      const banner = document.createElement('div');
      banner.style.cssText = 'background: #f0f7ff; border: 1px solid #cfe; border-radius: 4px; padding: 8px 12px; margin-bottom: 12px; font-family: monospace; font-size: 14px;';
      banner.textContent = `F(${state.varNames.join(',')}) = ${state.answerKey.expression}`;
      body.prepend(banner);
    }

    function renderTruthTable() {
      const body = document.getElementById('step2Body');
      body.innerHTML = '';
      renderExprBanner('step2Body');
      const tbl = document.createElement('table');
      tbl.className = 'truthTable';
      const thead = document.createElement('thead');
      const headRow = document.createElement('tr');
      for (const name of state.varNames) {
        const th = document.createElement('th');
        th.textContent = name;
        headRow.appendChild(th);
      }
      const fTh = document.createElement('th'); fTh.textContent = 'F'; headRow.appendChild(fTh);
      thead.appendChild(headRow); tbl.appendChild(thead);
      const tbody = document.createElement('tbody');
      for (let m = 0; m < state.values.length; m++) {
        const tr = document.createElement('tr');
        for (let i = 0; i < state.n; i++) {
          const td = document.createElement('td');
          td.textContent = (m >> (state.n - 1 - i)) & 1;
          tr.appendChild(td);
        }
        const fTd = document.createElement('td');
        fTd.className = 'f';
        fTd.dataset.minterm = m;
        fTd.textContent = state.values[m];
        if (state.values[m] === 'X') fTd.classList.add('x');
        fTd.addEventListener('click', () => cycleF(m));
        tr.appendChild(fTd);
        tbody.appendChild(tr);
      }
      tbl.appendChild(tbody);
      body.appendChild(tbl);
      const exprWrap = document.createElement('div');
      exprWrap.style.marginTop = '12px';
      exprWrap.innerHTML = `
  <button id="autoFillBtn" ${!state.answerKey ? 'disabled' : ''}>Fill F from expression</button>
  <button id="checkTtBtn" ${!state.answerKey ? 'disabled' : ''}>Check truth table</button>
  <span class="err" id="exprErr"></span>
  <span id="checkTtResult" style="margin-left: 12px; font-size: 13px;"></span>
  <button id="buildKmapBtn" style="margin-left: 24px;">Build K-map</button>
`;
      body.appendChild(exprWrap);
      document.getElementById('autoFillBtn').addEventListener('click', autoFillFromExpression);
      document.getElementById('checkTtBtn').addEventListener('click', checkTruthTable);
      document.getElementById('buildKmapBtn').addEventListener('click', () => {
        state.kmapBuilt = true;
        state.step = 5;
        state.kmapDraft = Array(1 << state.n).fill(null);
        document.getElementById('step3').classList.remove('disabled');
        document.getElementById('step4').classList.remove('disabled');
        document.getElementById('step5').classList.remove('disabled');
        renderAll();
      });
    }

    function cycleF(m) {
      const cur = state.values[m];
      state.values[m] = cur === 0 ? 1 : cur === 1 ? 'X' : 0;
      state.solverGroups = [];
      renderAll();
    }

    function renderAll() {
      if (state.step >= 2) renderTruthTable();
      if (state.step >= 3) renderKmap();
      if (state.step >= 4) {
        if (!state._step4Rendered) {
          renderStep4();
          state._step4Rendered = true;
        }
        renderOverlays();
      }
      if (state.step >= 5) {
        if (!state._step5Rendered) {
          renderStep5();
          state._step5Rendered = true;
        }
      }
      updateBreadcrumb();
    }

    function renderStep4() {
      const body = document.getElementById('step4Body');
      body.innerHTML = '';
      renderExprBanner('step4Body');

      // Default to manual mode
      state.manualMode = true;

      body.insertAdjacentHTML('beforeend', `
        <div id="manualSection">
          <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 8px;">
            <strong>Manual grouping</strong>
            <a href="#" class="edit-link" id="editValuesLink" title="Toggle to edit K-map cell values">&#9998; Edit cell values instead</a>
          </div>
          <div id="manualPanel"></div>
        </div>
        <div class="solve-section">
          <h4>Or auto-solve:</h4>
          <button id="solveSopBtn">Solve 1s (SOP)</button>
          <button id="solvePosBtn">Solve 0s (POS)</button>
          <button id="clearBtn">Clear</button>
          <button id="randomBtn">Random</button>
          <div id="resultExpr" style="margin-top: 12px; font-family: monospace; font-size: 16px;"></div>
        </div>
      `);

      document.getElementById('solveSopBtn').addEventListener('click', () => doSolve('SOP'));
      document.getElementById('solvePosBtn').addEventListener('click', () => doSolve('POS'));
      document.getElementById('clearBtn').addEventListener('click', clearMap);
      document.getElementById('randomBtn').addEventListener('click', randomFill);
      document.getElementById('editValuesLink').addEventListener('click', e => {
        e.preventDefault();
        state.manualMode = !state.manualMode;
        state.pendingSelection.clear();
        updatePendingHighlight();
        e.target.classList.toggle('active', !state.manualMode);
        e.target.textContent = state.manualMode ? '✎ Edit cell values instead' : '✓ Now editing cell values — click to switch back to grouping';
        document.getElementById('manualPanel').style.display = state.manualMode ? 'block' : 'none';
      });

      // Render manual panel by default since manualMode is on
      renderManualPanel();
    }

    function doSolve(mode) {
      state.solveMode = mode;
      const r = KMapCore.solve(state.values, state.n, mode, state.varNames);
      state.solverGroups = r.groups.map((g, i) => ({ ...g, color: paletteColor(i) }));
      document.getElementById('resultExpr').textContent = `F = ${r.expression}`;
      renderOverlays();
    }

    function renderOverlays() {
      const overlay = document.getElementById('kmapOverlay');
      if (!overlay) return;
      overlay.innerHTML = '';
      const all = [...state.solverGroups, ...state.manualGroups];
      if (all.length === 0) return;
      const cells = document.querySelectorAll('#step3Body .kmap-cell[data-minterm]');
      const cellRects = {};
      cells.forEach(cell => {
        const m = +cell.dataset.minterm;
        const { r, c } = KMapCore.mintermToCell(m, state.n);
        cellRects[`${r},${c}`] = cell.getBoundingClientRect();
      });
      const overlayRect = overlay.parentElement.getBoundingClientRect();
      all.forEach((g, gi) => {
        g.rects.forEach((rc, ri) => {
          const tl = cellRects[`${rc.r0},${rc.c0}`];
          const br = cellRects[`${rc.r0 + rc.h - 1},${rc.c0 + rc.w - 1}`];
          if (!tl || !br) return;
          const div = document.createElement('div');
          div.className = 'rect';
          div.dataset.groupIndex = String(gi);
          div.style.left = (tl.left - overlayRect.left - 3) + 'px';
          div.style.top = (tl.top - overlayRect.top - 3) + 'px';
          div.style.width = (br.right - tl.left + 6) + 'px';
          div.style.height = (br.bottom - tl.top + 6) + 'px';
          div.style.borderColor = g.color;
          div.style.backgroundColor = withAlpha(g.color, 0.18);
          div.title = g.term;
          // Show label only on the first rect of the group (avoid duplicate labels for wrap groups)
          if (ri === 0) {
            const label = document.createElement('span');
            label.className = 'rect-label';
            label.style.color = g.color;
            label.textContent = g.term;
            div.appendChild(label);
          }
          overlay.appendChild(div);
        });
      });
    }

    window.addEventListener('resize', renderOverlays);

    function clearMap() {
      state.values.fill('X');
      if (state.kmapDraft) state.kmapDraft.fill(null);
      state.solverGroups = [];
      state.manualGroups = [];
      const re = document.getElementById('resultExpr');
      if (re) re.textContent = '';
      renderAll();
    }

    function randomFill() {
      for (let i = 0; i < state.values.length; i++) state.values[i] = Math.random() < 0.5 ? 0 : 1;
      if (state.kmapDraft) for (let i = 0; i < state.kmapDraft.length; i++) state.kmapDraft[i] = state.values[i];
      state.solverGroups = [];
      renderAll();
    }

    function toggleManualMode(e) {
      state.manualMode = e.target.checked;
      state.pendingSelection.clear();
      updatePendingHighlight();
      const panel = document.getElementById('manualPanel');
      if (state.manualMode) {
        panel.style.display = 'block';
        renderManualPanel();
      } else {
        panel.style.display = 'none';
      }
    }

    function renderManualPanel() {
      const panel = document.getElementById('manualPanel');
      // Default polarity: existing solveMode, or SOP
      const polarity = state.solveMode || 'SOP';
      state.solveMode = polarity;
      panel.innerHTML = `
        <div>
          <label><input type="radio" name="manualPolarity" value="SOP" ${polarity==='SOP'?'checked':''}> SOP (group 1s)</label>
          <label style="margin-left: 12px;"><input type="radio" name="manualPolarity" value="POS" ${polarity==='POS'?'checked':''}> POS (group 0s)</label>
        </div>
        <div style="margin-top: 8px;">
          <button id="confirmGroupBtn">Confirm group</button>
          <button id="cancelGroupBtn">Cancel</button>
          <span class="err" id="manualErr" style="margin-left: 12px;"></span>
        </div>
        <div id="manualGroupList" style="margin-top: 8px;"></div>
        <div style="margin-top: 8px;">
          <button id="checkGroupsBtn">Check my groups</button>
          <div id="checkGroupsResult" style="margin-top: 6px; font-size: 13px; white-space: pre-line;"></div>
        </div>
      `;
      panel.querySelectorAll('input[name="manualPolarity"]').forEach(r => {
        r.addEventListener('change', e => { state.solveMode = e.target.value; });
      });
      document.getElementById('confirmGroupBtn').addEventListener('click', confirmManualGroup);
      document.getElementById('cancelGroupBtn').addEventListener('click', () => {
        state.pendingSelection.clear();
        updatePendingHighlight();
        document.getElementById('manualErr').textContent = '';
      });
      document.getElementById('checkGroupsBtn').addEventListener('click', checkManualGroups);
      renderManualGroupList();
    }

    function renderManualGroupList() {
      const list = document.getElementById('manualGroupList');
      if (!list) return;
      list.innerHTML = '';
      state.manualGroups.forEach((g, idx) => {
        const chip = document.createElement('span');
        chip.className = 'group-chip';
        chip.style.borderColor = g.color;
        chip.dataset.groupIndex = String(state.solverGroups.length + idx);  // overlay groups are indexed solver-then-manual
        chip.innerHTML = `
          <span class="swatch" style="background: ${g.color}"></span>
          <span class="term">${g.term}</span>
          <span class="remove" data-idx="${idx}">&#215;</span>
        `;
        chip.querySelector('.remove').addEventListener('click', e => {
          e.stopPropagation();
          state.manualGroups.splice(idx, 1);
          renderManualGroupList();
          renderOverlays();
        });
        chip.addEventListener('click', () => {
          // Flash the matching overlay rect(s)
          const gi = +chip.dataset.groupIndex;
          document.querySelectorAll(`#kmapOverlay .rect[data-group-index="${gi}"]`).forEach(r => {
            r.classList.add('flash');
            setTimeout(() => r.classList.remove('flash'), 800);
          });
        });
        list.appendChild(chip);
      });
    }

    function confirmManualGroup() {
      const errEl = document.getElementById('manualErr');
      errEl.textContent = '';
      const minterms = [...state.pendingSelection];
      if (minterms.length === 0) { errEl.textContent = 'Select cells first.'; return; }
      const cube = KMapCore.isValidCube(minterms, state.n);
      if (!cube.ok) { errEl.textContent = cube.reason; return; }
      const mode = state.solveMode || 'SOP';
      const target = mode === 'SOP' ? 1 : 0;
      for (const m of minterms) {
        if (state.values[m] !== target && state.values[m] !== 'X') {
          errEl.textContent = `contains a ${state.values[m]} cell`;
          return;
        }
      }
      const term = KMapCore.extractTerm(cube.andMask, cube.freeBits, state.n, state.varNames, mode);
      const idx = state.manualGroups.length;
      const color = paletteColor(idx);
      const rects = KMapCore.groupRects(minterms, state.n);
      state.manualGroups.push({
        minterms: minterms.slice().sort((a,b)=>a-b),
        term, color, rects,
        andMask: cube.andMask, freeBits: cube.freeBits,
      });
      state.pendingSelection.clear();
      updatePendingHighlight();
      renderManualGroupList();
      renderOverlays();
    }

    function checkManualGroups() {
      const out = document.getElementById('checkGroupsResult');
      if (state.manualGroups.length === 0) { out.textContent = 'No manual groups yet.'; return; }
      const mode = state.solveMode || 'SOP';
      const ref = KMapCore.solve(state.values, state.n, mode, state.varNames);
      const target = mode === 'SOP' ? 1 : 0;
      const required = [];
      for (let m = 0; m < state.values.length; m++) if (state.values[m] === target) required.push(m);

      const lines = [];
      // Per-group status
      state.manualGroups.forEach((g, i) => {
        const cube = KMapCore.isValidCube(g.minterms, state.n);
        if (!cube.ok) { lines.push(`Group ${i+1} (${g.term}): ✗ ${cube.reason}`); return; }
        let badPolarity = null;
        for (const m of g.minterms) {
          if (state.values[m] !== target && state.values[m] !== 'X') {
            badPolarity = m; break;
          }
        }
        if (badPolarity !== null) {
          lines.push(`Group ${i+1} (${g.term}): ✗ contains a ${state.values[badPolarity]} cell at m=${badPolarity}`); return;
        }
        // Primality: try to extend by flipping one fixed bit
        const fixedBits = ((1 << state.n) - 1) & ~cube.freeBits;
        let extendable = false;
        for (let bit = 0; bit < state.n; bit++) {
          const b = 1 << bit;
          if (!(fixedBits & b)) continue;
          const extendedFreeBits = cube.freeBits | b;
          const extendedAndMask = cube.andMask & ~b;
          // Build extended cube minterm set
          const ext = [];
          // enumerate subsets of extendedFreeBits
          let sub = 0;
          while (true) {
            ext.push(extendedAndMask | sub);
            if (sub === extendedFreeBits) break;
            sub = (sub - extendedFreeBits) & extendedFreeBits;
          }
          // Check all are valid (1/X for SOP, 0/X for POS)
          const allOk = ext.every(m => state.values[m] === target || state.values[m] === 'X');
          if (allOk) { extendable = true; break; }
        }
        if (extendable) lines.push(`Group ${i+1} (${g.term}): ⚠ valid cube but extendable (not prime)`);
        else lines.push(`Group ${i+1} (${g.term}): ✓ prime implicant`);
      });

      // Coverage
      const covered = new Set();
      for (const g of state.manualGroups) for (const m of g.minterms) covered.add(m);
      const missing = required.filter(m => !covered.has(m));
      lines.push('');
      if (missing.length === 0) lines.push('Coverage: ✓ all required minterms covered');
      else lines.push(`Coverage: missing minterms: ${missing.join(',')}`);

      // Minimality
      const userLits = state.manualGroups.reduce((sum, g) => sum + (state.n - KMapCore.popcount(g.freeBits)), 0);
      const refLits = ref.groups.reduce((sum, g) => {
        // ref.groups have term + minterms + rects + color, but freeBits is recoverable from minterms via popcount of XOR-ed bits.
        // Easier: re-validate to get freeBits.
        const c = KMapCore.isValidCube(g.minterms, state.n);
        return sum + (c.ok ? state.n - KMapCore.popcount(c.freeBits) : 0);
      }, 0);
      if (state.manualGroups.length === ref.groups.length && userLits <= refLits) lines.push('Minimality: ✓ minimal cover');
      else lines.push(`Minimality: your cover uses ${state.manualGroups.length} groups (${userLits} literals); minimum is ${ref.groups.length} (${refLits} literals)`);

      out.textContent = lines.join('\n');
    }

    function renderStep5() {
      const body = document.getElementById('step5Body');
      body.innerHTML = '';
      renderExprBanner('step5Body');
      body.insertAdjacentHTML('beforeend', `
        <button id="dlPngBtn">Download PNG</button>
        <button id="dlPdfBtn">Download PDF</button>
        <span class="err" id="exportErr" style="margin-left: 12px;"></span>
      `);
      document.getElementById('dlPngBtn').addEventListener('click', downloadPng);
      document.getElementById('dlPdfBtn').addEventListener('click', downloadPdf);
      if (!state._exportReady) {
        document.getElementById('dlPngBtn').disabled = true;
        document.getElementById('dlPdfBtn').disabled = true;
      }
    }

    async function snapshotSections() {
      if (typeof window.html2canvas !== 'function') {
        throw new Error('Export libs failed to load — check your internet connection.');
      }
      const step2 = document.getElementById('step2');
      const step3 = document.getElementById('step3');
      const c2 = await window.html2canvas(step2, { scale: 2, backgroundColor: '#ffffff' });
      const c3 = await window.html2canvas(step3, { scale: 2, backgroundColor: '#ffffff' });
      const resultExpr = document.getElementById('resultExpr');
      let cExpr = null;
      if (resultExpr && resultExpr.textContent.trim()) {
        const tmp = document.createElement('div');
        tmp.style.padding = '12px 20px';
        tmp.style.background = '#fff';
        tmp.style.fontFamily = 'monospace';
        tmp.style.fontSize = '20px';
        tmp.style.position = 'fixed';
        tmp.style.left = '-10000px';
        tmp.style.top = '0';
        tmp.textContent = resultExpr.textContent;
        document.body.appendChild(tmp);
        cExpr = await window.html2canvas(tmp, { scale: 2, backgroundColor: '#ffffff' });
        document.body.removeChild(tmp);
      }
      const w = Math.max(c2.width, c3.width, cExpr ? cExpr.width : 0);
      const h = c2.height + c3.height + (cExpr ? cExpr.height : 0);
      const out = document.createElement('canvas');
      out.width = w; out.height = h;
      const ctx = out.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, w, h);
      let y = 0;
      ctx.drawImage(c2, 0, y); y += c2.height;
      ctx.drawImage(c3, 0, y); y += c3.height;
      if (cExpr) ctx.drawImage(cExpr, 0, y);
      return out;
    }

    async function downloadPng() {
      const errEl = document.getElementById('exportErr');
      errEl.textContent = '';
      try {
        const canvas = await snapshotSections();
        const a = document.createElement('a');
        a.href = canvas.toDataURL('image/png');
        a.download = `kmap-${state.varNames.join('')}.png`;
        a.click();
      } catch (e) {
        errEl.textContent = e.message || 'Export failed.';
      }
    }

    async function downloadPdf() {
      const errEl = document.getElementById('exportErr');
      errEl.textContent = '';
      try {
        if (!window.jspdf) throw new Error('Export libs failed to load — check your internet connection.');
        const canvas = await snapshotSections();
        const img = canvas.toDataURL('image/png');
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ unit: 'pt', format: [canvas.width, canvas.height] });
        pdf.addImage(img, 'PNG', 0, 0, canvas.width, canvas.height);
        pdf.save(`kmap-${state.varNames.join('')}.pdf`);
      } catch (e) {
        errEl.textContent = e.message || 'Export failed.';
      }
    }

    function renderKmap() {
      if (!state.kmapBuilt) return;
      const body = document.getElementById('step3Body');
      body.innerHTML = '';
      renderExprBanner('step3Body');
      const { rows, cols } = KMapCore.rowsCols(state.n);
      const wrap = document.createElement('div'); wrap.className = 'kmap';
      const grid = document.createElement('div');

      // Header row: corner + column bit labels
      const top = document.createElement('div'); top.className = 'kmap-row';
      const corner = document.createElement('div'); corner.className = 'kmap-cell kmap-header';
      const labelMSB = state.n >= 3 ? state.varNames.slice(0, state.n - 2).join('') : '';
      const labelLSB = state.varNames.slice(state.n >= 3 ? state.n - 2 : 0).join('');
      corner.textContent = state.n >= 3 ? `${labelMSB}\\${labelLSB}` : labelLSB;
      top.appendChild(corner);
      for (const cBits of cols) {
        const h = document.createElement('div'); h.className = 'kmap-cell kmap-header';
        h.textContent = cBits.toString(2).padStart(state.n >= 3 ? 2 : 1, '0');
        top.appendChild(h);
      }
      grid.appendChild(top);

      // Data rows
      for (let r = 0; r < rows.length; r++) {
        const row = document.createElement('div'); row.className = 'kmap-row';
        const left = document.createElement('div'); left.className = 'kmap-cell kmap-header';
        if (state.n >= 3) left.textContent = rows[r].toString(2).padStart(2, '0');
        else if (state.n === 2) left.textContent = rows[r].toString();
        else left.textContent = '';
        row.appendChild(left);
        for (let c = 0; c < cols.length; c++) {
          const m = KMapCore.cellToMinterm(r, c, state.n);
          const cell = document.createElement('div'); cell.className = 'kmap-cell';
          cell.dataset.minterm = m;
          const v = state.kmapDraft[m];
          const display = v === null ? '' : String(v);
          cell.innerHTML = `<span class="mint">${m}</span>${display}`;
          if (v === 'X') cell.classList.add('x');
          cell.addEventListener('click', () => cycleKmap(m));
          row.appendChild(cell);
        }
        grid.appendChild(row);
      }
      wrap.appendChild(grid);

      // Overlay layer (used by Task 12 for group rendering)
      const overlay = document.createElement('div'); overlay.className = 'kmap-overlay'; overlay.id = 'kmapOverlay';
      wrap.appendChild(overlay);
      body.appendChild(wrap);

      // Drag-to-select wiring (only active when state.manualMode is true)
      const wrap2 = wrap; // the .kmap div from earlier in renderKmap
      function getCellMinterm(target) {
        const c = target.closest('.kmap-cell[data-minterm]');
        return c ? +c.dataset.minterm : null;
      }
      function rectFromCells(m1, m2) {
        const a = KMapCore.mintermToCell(m1, state.n);
        const b = KMapCore.mintermToCell(m2, state.n);
        const r0 = Math.min(a.r, b.r), r1 = Math.max(a.r, b.r);
        const c0 = Math.min(a.c, b.c), c1 = Math.max(a.c, b.c);
        const cells = [];
        for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) cells.push(KMapCore.cellToMinterm(r, c, state.n));
        return cells;
      }
      function setDragPreview(m1, m2) {
        document.querySelectorAll('#step3Body .kmap-cell.dragging').forEach(c => c.classList.remove('dragging'));
        if (m1 === null || m2 === null) return;
        const ms = new Set(rectFromCells(m1, m2));
        document.querySelectorAll('#step3Body .kmap-cell[data-minterm]').forEach(cell => {
          if (ms.has(+cell.dataset.minterm)) cell.classList.add('dragging');
        });
      }
      wrap2.addEventListener('mousedown', e => {
        if (!state.manualMode) return;
        const m = getCellMinterm(e.target);
        if (m === null) return;
        e.preventDefault();
        state.dragging = { active: true, startM: m, lastM: m, hadMove: false };
        setDragPreview(m, m);
      });
      wrap2.addEventListener('mousemove', e => {
        if (!state.dragging || !state.dragging.active) return;
        const m = getCellMinterm(e.target);
        if (m === null || m === state.dragging.lastM) return;
        state.dragging.lastM = m;
        state.dragging.hadMove = true;
        setDragPreview(state.dragging.startM, m);
      });
      window.addEventListener('mouseup', () => {
        if (!state.dragging || !state.dragging.active) return;
        const { startM, lastM, hadMove } = state.dragging;
        setDragPreview(null, null);
        if (hadMove) {
          // Commit the rectangle to pending selection (additive)
          for (const m of rectFromCells(startM, lastM)) state.pendingSelection.add(m);
          updatePendingHighlight();
          state.dragging = null;
          // Suppress the trailing click on the cell that ended the drag
          state._suppressClick = true;
          setTimeout(() => { state._suppressClick = false; }, 0);
        } else {
          state.dragging = null; // pure click — let cycleKmap's existing toggle handle it
        }
      });

      // Controls
      const ctrls = document.createElement('div'); ctrls.style.marginTop = '8px';
      ctrls.innerHTML = `
        <button id="autoFillKmapBtn">Auto-fill from truth table</button>
        <button id="checkKmapBtn">Check K-map</button>
        <span id="checkKmapResult" style="margin-left: 12px; font-size: 13px;"></span>
      `;
      body.appendChild(ctrls);
      document.getElementById('autoFillKmapBtn').addEventListener('click', autoFillKmap);
      document.getElementById('checkKmapBtn').addEventListener('click', checkKmap);
    }

    function cycleKmap(m) {
      if (state._suppressClick) return;
      if (state.manualMode) {
        if (state.pendingSelection.has(m)) state.pendingSelection.delete(m);
        else state.pendingSelection.add(m);
        updatePendingHighlight();
        return;
      }
      const cur = state.kmapDraft[m];
      if (cur === null) state.kmapDraft[m] = 0;
      else if (cur === 0) state.kmapDraft[m] = 1;
      else if (cur === 1) state.kmapDraft[m] = 'X';
      else state.kmapDraft[m] = 0;
      renderAll();
    }

    function updatePendingHighlight() {
      document.querySelectorAll('#step3Body .kmap-cell[data-minterm]').forEach(cell => {
        const m = +cell.dataset.minterm;
        cell.classList.toggle('pending', state.pendingSelection.has(m));
      });
    }

    function autoFillKmap() {
      for (let m = 0; m < state.values.length; m++) state.kmapDraft[m] = state.values[m];
      state.solverGroups = [];
      renderAll();
    }

    function checkKmap() {
      let pass = 0; const wrong = [];
      document.querySelectorAll('#step3Body .kmap-cell[data-minterm]').forEach(cell => {
        const m = +cell.dataset.minterm;
        const expected = state.values[m];
        const actual = state.kmapDraft[m];
        const ok = (actual !== null) && (actual === expected);
        cell.classList.toggle('wrong', !ok);
        if (ok) pass++; else { wrong.push(m); cell.title = `expected ${expected}`; }
      });
      document.getElementById('checkKmapResult').textContent =
        `${pass} / ${state.values.length} correct` + (wrong.length ? ` — wrong: m=${wrong.join(',')}` : '');
    }

    function autoFillFromExpression() {
      if (!state.answerKey) return;
      for (let m = 0; m < state.values.length; m++) state.values[m] = state.answerKey.evaluated[m];
      state.solverGroups = [];
      renderAll();
    }

    function checkTruthTable() {
      if (!state.answerKey) return;
      const correct = state.answerKey.evaluated;
      let pass = 0; const wrong = [];
      document.querySelectorAll('#step2Body td.f').forEach(td => {
        const m = +td.dataset.minterm;
        const ok = state.values[m] === correct[m];
        td.classList.toggle('wrong', !ok);
        if (ok) pass++; else { wrong.push(m); td.title = `expected ${correct[m]}`; }
      });
      document.getElementById('checkTtResult').textContent =
        `${pass} / ${1 << state.n} correct` + (wrong.length ? ` — wrong: m=${wrong.join(',')}` : '');
    }

    function renderNameInputs() {
      const n = parseInt(document.getElementById('varCount').value, 10);
      const wrap = document.getElementById('nameInputs');
      const defaults = ['A','B','C','D'];
      wrap.innerHTML = '';
      for (let i = 0; i < n; i++) {
        const inp = document.createElement('input');
        inp.value = defaults[i];
        inp.maxLength = 4;
        inp.dataset.idx = i;
        inp.addEventListener('input', validateStep1);
        wrap.appendChild(inp);
      }
      validateStep1();
    }

    function validateStep1() {
      const inputs = [...document.querySelectorAll('#nameInputs input')];
      const names = inputs.map(i => i.value.trim());
      const errEl = document.getElementById('step1Err');
      let err = '';
      if (names.some(s => s === '')) err = 'All names are required.';
      else if (names.some(s => !/^[A-Za-z][A-Za-z0-9]*$/.test(s))) err = 'Names must start with a letter and be alphanumeric.';
      else if (new Set(names).size !== names.length) err = 'Names must be unique.';
      else if (names.some(s => RESERVED.has(s))) err = 'Names cannot be AND, OR, or NOT.';
      errEl.textContent = err;
      document.getElementById('continueBtn').disabled = !!err;
      return !err;
    }

    document.getElementById('varCount').addEventListener('change', renderNameInputs);
    document.getElementById('continueBtn').addEventListener('click', () => {
      if (!validateStep1()) return;
      const exprSrc = document.getElementById('exprInput').value.trim();
      const errEl = document.getElementById('step1ExprErr');
      errEl.textContent = '';
      state.n = parseInt(document.getElementById('varCount').value, 10);
      state.varNames = [...document.querySelectorAll('#nameInputs input')].map(i => i.value.trim());
      state.values = Array(1 << state.n).fill('X');
      state.answerKey = null;
      if (exprSrc) {
        const r = KMapCore.parseExpression(exprSrc, state.varNames);
        if (!r.ok) { errEl.textContent = r.error; return; }
        const evaluated = [];
        for (let m = 0; m < (1 << state.n); m++) evaluated.push(KMapCore.evaluateExpr(r.ast, m, state.n));
        state.answerKey = { expression: exprSrc, evaluated };
      }
      state.step = 2;
      document.getElementById('step2').classList.remove('disabled');
      renderAll();
    });

    function updateBreadcrumb() {
      const labels = document.querySelectorAll('#breadcrumb span');
      // Spans alternate label, arrow, label, arrow, ...
      // Indices 0, 2, 4, 6, 8 = step labels for steps 1..5
      for (let i = 0; i < 5; i++) {
        const span = labels[i * 2];
        if (!span) continue;
        span.classList.toggle('active', state.step === i + 1);
      }
    }

    function resetFromStep(s) {
      if (!confirm(`Reset Step ${s} and everything below?`)) return;
      if (s <= 2) { state.values = state.n ? Array(1 << state.n).fill('X') : []; state.answerKey = null; }
      if (s <= 3) { state.kmapDraft = null; state.kmapBuilt = false; }
      if (s <= 4) { state.solverGroups = []; state.manualGroups = []; state.manualMode = false; state.pendingSelection.clear(); state.solveMode = null; }
      state._step4Rendered = false;
      state._step5Rendered = false;
      state.step = Math.max(1, s - 1);
      // Reset visual disabled state
      for (let i = s; i <= 5; i++) {
        const el = document.getElementById('step' + i);
        if (el) el.classList.add('disabled');
        const body = document.getElementById('step' + i + 'Body');
        if (body) body.innerHTML = '';
      }
      renderAll();
      updateBreadcrumb();
    }

    document.querySelectorAll('.reset-link').forEach(a => {
      a.addEventListener('click', e => {
        e.preventDefault();
        resetFromStep(+a.dataset.step);
      });
    });

    renderNameInputs();
    updateBreadcrumb();

    // CDN fallback check
    window.addEventListener('load', () => {
      const missing = [];
      if (typeof window.html2canvas !== 'function') missing.push('html2canvas');
      if (!window.jspdf) missing.push('jsPDF');
      if (missing.length) {
        state._exportReady = false;
        showError('Export libs failed to load: ' + missing.join(', ') + '. Check your internet connection. Other features still work.');
        // If Step 5 is already visible, disable its buttons
        const png = document.getElementById('dlPngBtn'), pdf = document.getElementById('dlPdfBtn');
        if (png) png.disabled = true;
        if (pdf) pdf.disabled = true;
      }
    });
  </script>
</body>
</html>
