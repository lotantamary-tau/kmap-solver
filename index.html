<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>K-Map Solver</title>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="kmap-core.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 1100px; margin: 24px auto; padding: 0 16px; }
    h1 { margin: 0 0 8px; }
    .step { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-top: 16px; }
    .step.disabled { opacity: 0.5; pointer-events: none; }
    .breadcrumb { display: flex; gap: 8px; font-size: 13px; color: #666; margin-bottom: 12px; }
    .breadcrumb .active { color: #000; font-weight: 600; }
    .name-inputs { display: flex; gap: 8px; flex-wrap: wrap; }
    .name-inputs input { width: 60px; padding: 4px; }
    .err { color: #c00; font-size: 13px; margin-top: 4px; }
    button { padding: 6px 12px; border-radius: 4px; border: 1px solid #888; background: #f5f5f5; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    table.truthTable { border-collapse: collapse; margin-top: 8px; }
    table.truthTable th, table.truthTable td { border: 1px solid #999; padding: 4px 10px; text-align: center; min-width: 30px; }
    table.truthTable td.f { cursor: pointer; user-select: none; font-weight: 600; }
    table.truthTable td.f.x { color: #888; font-style: italic; }
    table.truthTable td.f.wrong { background: #fdd; }
    .kmap { display: inline-block; position: relative; margin-top: 8px; }
    .kmap-row { display: flex; }
    .kmap-cell { width: 60px; height: 60px; border: 1px solid #999; display: flex; align-items: center; justify-content: center; font-size: 18px; cursor: pointer; user-select: none; position: relative; background: #fff; }
    .kmap-cell .mint { position: absolute; top: 2px; left: 4px; font-size: 10px; color: #aaa; }
    .kmap-cell.x { color: #888; font-style: italic; }
    .kmap-cell.wrong { background: #fdd; }
    .kmap-header { font-size: 12px; color: #666; padding: 4px 8px; }
    .kmap-overlay { position: absolute; top: 0; left: 0; pointer-events: none; }
    .kmap-overlay .rect { position: absolute; border: 2px solid; border-radius: 6px; }
  </style>
</head>
<body>
  <h1>K-Map Solver</h1>
  <div class="breadcrumb" id="breadcrumb">
    <span class="active">1. Variables</span>
    <span>→</span><span>2. Truth table</span>
    <span>→</span><span>3. K-map</span>
    <span>→</span><span>4. Solve</span>
    <span>→</span><span>5. Export</span>
  </div>

  <section id="step1" class="step">
    <h2>Step 1 — Variables</h2>
    <label>How many variables?
      <select id="varCount">
        <option value="1">1</option>
        <option value="2">2</option>
        <option value="3">3</option>
        <option value="4" selected>4</option>
      </select>
    </label>
    <div style="margin-top: 8px;">
      Names: <span class="name-inputs" id="nameInputs"></span>
    </div>
    <div class="err" id="step1Err"></div>
    <button id="continueBtn" style="margin-top: 12px;">Continue</button>
  </section>

  <section id="step2" class="step disabled"><h2>Step 2 — Truth table</h2><div id="step2Body"></div></section>
  <section id="step3" class="step disabled"><h2>Step 3 — K-map</h2><div id="step3Body"></div></section>
  <section id="step4" class="step disabled"><h2>Step 4 — Solve</h2><div id="step4Body"></div></section>
  <section id="step5" class="step disabled"><h2>Step 5 — Export</h2><div id="step5Body"></div></section>

  <script>
    'use strict';
    const RESERVED = new Set(['AND','OR','NOT','and','or','not']);
    const state = {
      n: null, varNames: [], values: [], step: 1, kmapBuilt: false,
      answerKey: null, solveMode: null, solverGroups: [], manualGroups: [],
      manualMode: false, pendingSelection: new Set(),
      kmapDraft: null,  // null until Step 3 begins; then Array(2^n) of (0|1|'X'|null) for "Check K-map"
      _step4Rendered: false,
    };

    function renderTruthTable() {
      const body = document.getElementById('step2Body');
      body.innerHTML = '';
      const tbl = document.createElement('table');
      tbl.className = 'truthTable';
      const thead = document.createElement('thead');
      const headRow = document.createElement('tr');
      for (const name of state.varNames) {
        const th = document.createElement('th');
        th.textContent = name;
        headRow.appendChild(th);
      }
      const fTh = document.createElement('th'); fTh.textContent = 'F'; headRow.appendChild(fTh);
      thead.appendChild(headRow); tbl.appendChild(thead);
      const tbody = document.createElement('tbody');
      for (let m = 0; m < state.values.length; m++) {
        const tr = document.createElement('tr');
        for (let i = 0; i < state.n; i++) {
          const td = document.createElement('td');
          td.textContent = (m >> (state.n - 1 - i)) & 1;
          tr.appendChild(td);
        }
        const fTd = document.createElement('td');
        fTd.className = 'f';
        fTd.dataset.minterm = m;
        fTd.textContent = state.values[m];
        if (state.values[m] === 'X') fTd.classList.add('x');
        fTd.addEventListener('click', () => cycleF(m));
        tr.appendChild(fTd);
        tbody.appendChild(tr);
      }
      tbl.appendChild(tbody);
      body.appendChild(tbl);
      const exprWrap = document.createElement('div');
      exprWrap.style.marginTop = '12px';
      exprWrap.innerHTML = `
  <label>Expression: <input id="exprInput" type="text" style="width: 300px;" placeholder="${state.varNames.join('')} + ${state.varNames[0]}'..."></label>
  <button id="autoFillBtn">Auto-fill F column</button>
  <button id="setKeyBtn">Set as answer key</button>
  <button id="checkTtBtn" disabled>Check truth table</button>
  <span class="err" id="exprErr"></span>
  <span id="checkTtResult" style="margin-left: 12px; font-size: 13px;"></span>
  <button id="buildKmapBtn" style="margin-left: 24px;">Build K-map</button>
`;
      body.appendChild(exprWrap);
      document.getElementById('autoFillBtn').addEventListener('click', () => applyExpression('autofill'));
      document.getElementById('setKeyBtn').addEventListener('click', () => applyExpression('answerkey'));
      document.getElementById('checkTtBtn').addEventListener('click', checkTruthTable);
      document.getElementById('buildKmapBtn').addEventListener('click', () => {
        state.kmapBuilt = true;
        state.step = 4;
        state.kmapDraft = Array(1 << state.n).fill(null);
        document.getElementById('step3').classList.remove('disabled');
        document.getElementById('step4').classList.remove('disabled');
        renderAll();
      });
      if (state.answerKey) document.getElementById('checkTtBtn').disabled = false;
    }

    function cycleF(m) {
      const cur = state.values[m];
      state.values[m] = cur === 0 ? 1 : cur === 1 ? 'X' : 0;
      state.solverGroups = [];
      renderAll();
    }

    function renderAll() {
      if (state.step >= 2) renderTruthTable();
      if (state.step >= 3) renderKmap();
      if (state.step >= 4) {
        if (!state._step4Rendered) {
          renderStep4();
          state._step4Rendered = true;
        }
        renderOverlays();
      }
      // Step 5 added in Task 14.
    }

    function renderStep4() {
      const body = document.getElementById('step4Body');
      body.innerHTML = `
        <button id="solveSopBtn">Solve 1s (SOP)</button>
        <button id="solvePosBtn">Solve 0s (POS)</button>
        <button id="clearBtn">Clear</button>
        <button id="randomBtn">Random</button>
        <label style="margin-left: 16px;"><input type="checkbox" id="manualMode"> Manual mode</label>
        <div id="resultExpr" style="margin-top: 12px; font-family: monospace; font-size: 16px;"></div>
        <div id="manualPanel" style="display: none; margin-top: 12px;"></div>
      `;
      document.getElementById('solveSopBtn').addEventListener('click', () => doSolve('SOP'));
      document.getElementById('solvePosBtn').addEventListener('click', () => doSolve('POS'));
      document.getElementById('clearBtn').addEventListener('click', clearMap);
      document.getElementById('randomBtn').addEventListener('click', randomFill);
      document.getElementById('manualMode').addEventListener('change', toggleManualMode);
    }

    function doSolve(mode) {
      state.solveMode = mode;
      const r = KMapCore.solve(state.values, state.n, mode, state.varNames);
      state.solverGroups = r.groups;
      document.getElementById('resultExpr').textContent = `F = ${r.expression}`;
      renderOverlays();
    }

    function renderOverlays() {
      const overlay = document.getElementById('kmapOverlay');
      if (!overlay) return;
      overlay.innerHTML = '';
      const all = [...state.solverGroups, ...state.manualGroups];
      if (all.length === 0) return;
      const cells = document.querySelectorAll('#step3Body .kmap-cell[data-minterm]');
      const cellRects = {};
      cells.forEach(cell => {
        const m = +cell.dataset.minterm;
        const { r, c } = KMapCore.mintermToCell(m, state.n);
        cellRects[`${r},${c}`] = cell.getBoundingClientRect();
      });
      const overlayRect = overlay.parentElement.getBoundingClientRect();
      for (const g of all) {
        for (const rc of g.rects) {
          const tl = cellRects[`${rc.r0},${rc.c0}`];
          const br = cellRects[`${rc.r0 + rc.h - 1},${rc.c0 + rc.w - 1}`];
          if (!tl || !br) continue;
          const div = document.createElement('div');
          div.className = 'rect';
          div.style.left = (tl.left - overlayRect.left - 2) + 'px';
          div.style.top = (tl.top - overlayRect.top - 2) + 'px';
          div.style.width = (br.right - tl.left + 4) + 'px';
          div.style.height = (br.bottom - tl.top + 4) + 'px';
          div.style.borderColor = g.color;
          div.title = g.term;
          overlay.appendChild(div);
        }
      }
    }

    window.addEventListener('resize', renderOverlays);

    function clearMap() {
      state.values.fill(0);
      if (state.kmapDraft) state.kmapDraft.fill(0);
      state.solverGroups = [];
      state.manualGroups = [];
      const re = document.getElementById('resultExpr');
      if (re) re.textContent = '';
      renderAll();
    }

    function randomFill() {
      for (let i = 0; i < state.values.length; i++) state.values[i] = Math.random() < 0.5 ? 0 : 1;
      if (state.kmapDraft) for (let i = 0; i < state.kmapDraft.length; i++) state.kmapDraft[i] = state.values[i];
      state.solverGroups = [];
      renderAll();
    }

    function toggleManualMode(e) {
      state.manualMode = e.target.checked;
      // Task 13 will populate the manual panel.
    }

    function renderKmap() {
      if (!state.kmapBuilt) return;
      const body = document.getElementById('step3Body');
      body.innerHTML = '';
      const { rows, cols } = KMapCore.rowsCols(state.n);
      const wrap = document.createElement('div'); wrap.className = 'kmap';
      const grid = document.createElement('div');

      // Header row: corner + column bit labels
      const top = document.createElement('div'); top.className = 'kmap-row';
      const corner = document.createElement('div'); corner.className = 'kmap-cell kmap-header';
      const labelMSB = state.n >= 3 ? state.varNames.slice(0, state.n - 2).join('') : '';
      const labelLSB = state.varNames.slice(state.n >= 3 ? state.n - 2 : 0).join('');
      corner.textContent = state.n >= 3 ? `${labelMSB}\\${labelLSB}` : labelLSB;
      top.appendChild(corner);
      for (const cBits of cols) {
        const h = document.createElement('div'); h.className = 'kmap-cell kmap-header';
        h.textContent = cBits.toString(2).padStart(state.n >= 3 ? 2 : 1, '0');
        top.appendChild(h);
      }
      grid.appendChild(top);

      // Data rows
      for (let r = 0; r < rows.length; r++) {
        const row = document.createElement('div'); row.className = 'kmap-row';
        const left = document.createElement('div'); left.className = 'kmap-cell kmap-header';
        if (state.n >= 3) left.textContent = rows[r].toString(2).padStart(2, '0');
        else if (state.n === 2) left.textContent = rows[r].toString();
        else left.textContent = '';
        row.appendChild(left);
        for (let c = 0; c < cols.length; c++) {
          const m = KMapCore.cellToMinterm(r, c, state.n);
          const cell = document.createElement('div'); cell.className = 'kmap-cell';
          cell.dataset.minterm = m;
          const v = state.kmapDraft[m];
          const display = v === null ? '' : String(v);
          cell.innerHTML = `<span class="mint">${m}</span>${display}`;
          if (v === 'X') cell.classList.add('x');
          cell.addEventListener('click', () => cycleKmap(m));
          row.appendChild(cell);
        }
        grid.appendChild(row);
      }
      wrap.appendChild(grid);

      // Overlay layer (used by Task 12 for group rendering)
      const overlay = document.createElement('div'); overlay.className = 'kmap-overlay'; overlay.id = 'kmapOverlay';
      wrap.appendChild(overlay);
      body.appendChild(wrap);

      // Controls
      const ctrls = document.createElement('div'); ctrls.style.marginTop = '8px';
      ctrls.innerHTML = `
        <button id="autoFillKmapBtn">Auto-fill from truth table</button>
        <button id="checkKmapBtn">Check K-map</button>
        <span id="checkKmapResult" style="margin-left: 12px; font-size: 13px;"></span>
      `;
      body.appendChild(ctrls);
      document.getElementById('autoFillKmapBtn').addEventListener('click', autoFillKmap);
      document.getElementById('checkKmapBtn').addEventListener('click', checkKmap);
    }

    function cycleKmap(m) {
      const cur = state.kmapDraft[m];
      // Cycle: null → 0 → 1 → X → 0 (after first click, never returns to null)
      if (cur === null) state.kmapDraft[m] = 0;
      else if (cur === 0) state.kmapDraft[m] = 1;
      else if (cur === 1) state.kmapDraft[m] = 'X';
      else state.kmapDraft[m] = 0;
      renderAll();
    }

    function autoFillKmap() {
      for (let m = 0; m < state.values.length; m++) state.kmapDraft[m] = state.values[m];
      state.solverGroups = [];
      renderAll();
    }

    function checkKmap() {
      let pass = 0; const wrong = [];
      document.querySelectorAll('#step3Body .kmap-cell[data-minterm]').forEach(cell => {
        const m = +cell.dataset.minterm;
        const expected = state.values[m];
        const actual = state.kmapDraft[m];
        const ok = (actual !== null) && (actual === expected);
        cell.classList.toggle('wrong', !ok);
        if (ok) pass++; else { wrong.push(m); cell.title = `expected ${expected}`; }
      });
      document.getElementById('checkKmapResult').textContent =
        `${pass} / ${state.values.length} correct` + (wrong.length ? ` — wrong: m=${wrong.join(',')}` : '');
    }

    function applyExpression(mode) {
      const src = document.getElementById('exprInput').value;
      const errEl = document.getElementById('exprErr');
      const r = KMapCore.parseExpression(src, state.varNames);
      if (!r.ok) { errEl.textContent = r.error; return; }
      errEl.textContent = '';
      const evaluated = [];
      for (let m = 0; m < (1 << state.n); m++) evaluated.push(KMapCore.evaluateExpr(r.ast, m, state.n));
      if (mode === 'autofill') {
        for (let m = 0; m < evaluated.length; m++) state.values[m] = evaluated[m];
        state.solverGroups = [];
      }
      state.answerKey = { expression: src, evaluated };
      document.getElementById('checkTtBtn').disabled = false;
      renderAll();
    }

    function checkTruthTable() {
      if (!state.answerKey) return;
      const correct = state.answerKey.evaluated;
      let pass = 0; const wrong = [];
      document.querySelectorAll('#step2Body td.f').forEach(td => {
        const m = +td.dataset.minterm;
        const ok = state.values[m] === correct[m];
        td.classList.toggle('wrong', !ok);
        if (ok) pass++; else { wrong.push(m); td.title = `expected ${correct[m]}`; }
      });
      document.getElementById('checkTtResult').textContent =
        `${pass} / ${1 << state.n} correct` + (wrong.length ? ` — wrong: m=${wrong.join(',')}` : '');
    }

    function renderNameInputs() {
      const n = parseInt(document.getElementById('varCount').value, 10);
      const wrap = document.getElementById('nameInputs');
      const defaults = ['A','B','C','D'];
      wrap.innerHTML = '';
      for (let i = 0; i < n; i++) {
        const inp = document.createElement('input');
        inp.value = defaults[i];
        inp.maxLength = 4;
        inp.dataset.idx = i;
        inp.addEventListener('input', validateStep1);
        wrap.appendChild(inp);
      }
      validateStep1();
    }

    function validateStep1() {
      const inputs = [...document.querySelectorAll('#nameInputs input')];
      const names = inputs.map(i => i.value.trim());
      const errEl = document.getElementById('step1Err');
      let err = '';
      if (names.some(s => s === '')) err = 'All names are required.';
      else if (names.some(s => !/^[A-Za-z][A-Za-z0-9]*$/.test(s))) err = 'Names must start with a letter and be alphanumeric.';
      else if (new Set(names).size !== names.length) err = 'Names must be unique.';
      else if (names.some(s => RESERVED.has(s))) err = 'Names cannot be AND, OR, or NOT.';
      errEl.textContent = err;
      document.getElementById('continueBtn').disabled = !!err;
      return !err;
    }

    document.getElementById('varCount').addEventListener('change', renderNameInputs);
    document.getElementById('continueBtn').addEventListener('click', () => {
      if (!validateStep1()) return;
      state.n = parseInt(document.getElementById('varCount').value, 10);
      state.varNames = [...document.querySelectorAll('#nameInputs input')].map(i => i.value.trim());
      state.values = Array(1 << state.n).fill(0);
      state.step = 2;
      document.getElementById('step2').classList.remove('disabled');
      renderAll();
    });

    renderNameInputs();
  </script>
</body>
</html>
